<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
.hero {
  display: grid;
  justify-items: center;
  width: 100%;
  overflow: hidden;
}

.hero-image {
  width: 100%;
  height: auto;
  display: block;
  grid-area: 1 / 1;
}

.hero-title {
  grid-area: 1 / 1;
  font-size: 50px;
  font-weight: 700;
  color: #1F263E;
  margin: 0;
  align-self: start;
  margin-top: 40px;
}
</style>
</head>
<body>

<section class="hero">
  <img src="/pictures/ShopImages/ShopBackgroundImage.png" class="hero-image">
  <h1 class="hero-title">Shop</h1>
</section>

</body>
</html>
