<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Organick</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
    
    <!-- Твои стили -->
    <link rel="stylesheet" href="../css/Homepage/HomepageBase.css">
    <link rel="stylesheet" href="../css/Homepage/HomepageLayout.css">
    <link rel="stylesheet" href="../css/Header.css">
    <link rel="stylesheet" href="../css/Footer.css"> 
    <link rel="stylesheet" href="../css/Card/CardBase.css">
</head>
<body>
    
    <!-- 1. ХЕДЕР -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <a href="#" class="logo">
                   <img src="/pictures/HomepageImages/Logo.svg" alt="Logo picture">
                    <span>Organick</span>
                </a>

                <nav class="nav-menu">
                    <ul>
                        <li><a href="/homepage.html">Home</a></li>
                        <li><a href="/html/AboutUs.html">About</a></li>
                        <li><a href="/html/Shop.html">Shop</a></li>
                        <li><a href="#">Register</a></li>
                        <li><a href="#">Log in</a></li>
                    </ul>
                </nav>
            </div>

            <div class="header-right">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search...">
                    <button class="search-btn" id="searchBtn">
                        <img src="/pictures/HomepageImages/Search-Icon.svg" alt="Search icon">
                    </button>
                </div>

                <!-- ✅ Кнопка корзины (Ссылка на саму эту страницу) -->
                <a href="/html/Cart.html" class="cart-btn" id="cartBtn">
                    <div class="cart-icon">
                        <img src="/pictures/HomepageImages/Cart Icon.svg" alt="cart-icon">
                    </div>
                    <span id="cartCount">Cart(0)</span>
                </a>

                <div class="header-controls">
                    <button class="control-btn">li</button>
                    <button class="control-btn">en</button>
                    <button class="control-btn">A+</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. БАННЕР (Hero Section) -->
    <section class="hero">
        <div class="hero-inner">
            <!--  Убедись, что путь к картинке верный! -->
            <img src="/pictures/CardImages/CardBanner.jpg" alt="Cart Banner" class="hero-image">
        </div>
    </section>

    <!-- 3. СЕКЦИЯ КОРЗИНЫ -->
    <section class="cart-section">
        <div class="prod-container">
            
            <!-- Пустая корзина -->
            <div id="emptyCart" class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Add some products to see them here</p>
                <a href="/html/Shop.html" class="btn-primary btn-shop-settings">
                    <span class="btn-text-offset">Continue Shopping</span>
                    <img src="/pictures/HomepageImages/ArrowForButton.svg" alt="arrow" class="btn-arrow">
                </a>
            </div>

            <!-- Заполненная корзина -->
            <div id="cartItems" class="cart-items" style="display: none;">
                <!-- Товары будут здесь -->
            </div>
        </div>
    </section>

<script src="/js/update.js"></script>
<script src="/js/app.js"></script>
<script src="/js/card.js"></script>

</body>
</html>
