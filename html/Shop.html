<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Organick</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/Homepage/HomepageBase.css">
    <link rel="stylesheet" href="../css/Homepage/HomepageLayout.css">
    <link rel="stylesheet" href="../css/ShopPage/ShopBase.css">
    <link rel="stylesheet" href="../css/Header.css">
    <link rel="stylesheet" href="../css/Pagination.css">

</head>
<body>

    <!-- ========== HEADER (из предыдущих секций) ========== -->
    <header class="header">
        <div class="container">
            
            <div class="header-left">
                <a href="#" class="logo">
                   <img src="/pictures/HomepageImages/Logo.svg" alt="Logo picture">
                    <span>Organick</span>
                </a>

                <nav class="nav-menu">
                    <ul>
                        <li><a href="/homepage.html">Home</a></li>
                        <li><a href="html/AboutUs.html">About</a></li>
                        <li><a href="html/Shop.html">Shop</a></li>
                        <li><a href="#">Register</a></li>
                        <li><a href="#">Log in</a></li>
                    </ul>
                </nav>
            </div>

            <div class="header-right">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search...">
                    <button class="search-btn" id="searchBtn">
                        <img src="/pictures/HomepageImages/Search-Icon.svg" alt="Search icon">
                    </button>
                </div>

                <div class="cart-btn" id="cartBtn">
                    <div class="cart-icon">
                        <img src="/pictures/HomepageImages/Cart Icon.svg" alt="cart-icon">
                    </div>
                    <span id="cartCount">Cart(0)</span>
                </div>

                <div class="header-controls">
                    <button class="control-btn">li</button>
                    <button class="control-btn">en</button>
                    <button class="control-btn">A+</button>
                </div>

            </div>

        </div>
    </header>

    <section class="hero">
        <div class="hero-inner">
            <img src="/pictures/ShopImages/ShopBackgroundImage.png" alt="Shop" class="hero-image">
            <h1 class="hero-title">Shop</h1>
        </div>
    </section>

    <section class="shop-products-section">
        <div class="prod-container">

        <!-- Сетка товаров (сюда JS добавит карточки) -->
        <div class="prod-grid" id="productsGrid">
            <!-- Товары загрузятся через JS -->
        </div>

        <!-- Управление: Стрелки + Сортировка -->
        <div class="pagination-wrapper">
    <!-- Кнопка влево -->
    <button id="prevBtn" class="arrow-btn">
        <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    
    <!-- Кнопка вправо -->
    <button id="nextBtn" class="arrow-btn">
        <svg viewBox="0 0 24 24">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>
</div>
    
<div class="shop-controls-buttons">
    
    <button id="sortPriceBtn" class="btn-primary">
        Sort By Price
    </button>

    <button id="resetSortBtn" class="btn-primary">
        Reset Sort
    </button>
</div>

    </div>
</section>

    <script src="/js/app.js"></script>
    <script src="/js/shop.js"></script>
</body>
</html>
