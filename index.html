<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organick Header</title>
    <!-- Подключаем шрифт Inter для максимального сходства -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
     <link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            
            <!-- Левая часть: Лого и Меню -->
            <div class="header-left">
                <a href="#" class="logo">
                   <img src="pictures/Logo.svg" alt="Logo picture">
                    <span>Organick</span>
                </a>

                <nav class="nav-menu">
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Shop</a></li>
                        <li><a href="#">Projects</a></li>
                        <li><a href="#">Register</a></li>
                        <li><a href="#">Log in</a></li>
                    </ul>
                </nav>
            </div>

            <!-- Правая часть: Поиск и Корзина -->
            <div class="header-right">
                <!-- Блок поиска (Rectangle 4 из макета) -->
                <div class="search-bar">
                    <button class="search-btn">
                        <img src="pictures/Search-Icon.svg" alt="Serach icon">
                    </button>
                </div>

                <div class="cart-btn">
                    <div class="cart-icon">
                        <img src="pictures/Cart Icon.svg" alt="cart-icon">
                    </div>
                    <span>Cart</span>
                </div>
            </div>

        </div>
    </header>

    <section class="main-banner">

        <img src="pictures/background.jpg" alt="Background" class="banner-bg-image">
    
    <div class="banner-wrapper">
        <div class="banner-text">
            <span class="banner-subtitle">100% Natural Food</span>
            <h1 class="banner-heading">
                <span class="heading-line-1">Choose the best</span> <br>
                <span class="heading-line-2">healthier way</span> <br>
                <span class="heading-last-line">of life</span>
            </h1>
            
            <a href="#" class="action-button">
                <span class="word-explore">Explore</span>
                <span class="word-now">Now</span>
                <img src="pictures/ArrowForButton.svg" alt="arrow">
            </a>
        </div>
    </div>
</section>

</body>
</html>
